---
- name: Flush iptables rules before deployment
  command: iptables -F
  become: yes
  ignore_errors: yes

- name: Remove default REJECT rules from iptables
  block:
    - name: Remove INPUT REJECT rule
      command: iptables -D INPUT -j REJECT --reject-with icmp-host-prohibited
      become: yes
      ignore_errors: yes

    - name: Remove FORWARD REJECT rule
      command: iptables -D FORWARD -j REJECT --reject-with icmp-host-prohibited
      become: yes
      ignore_errors: yes

    - name: Remove REJECT rules from /etc/sysconfig/iptables
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/iptables
        regexp: '{{ item }}'
        state: absent
      become: yes
      ignore_errors: yes
      loop:
        - '^-A INPUT -j REJECT --reject-with icmp-host-prohibited'
        - '^-A FORWARD -j REJECT --reject-with icmp-host-prohibited'

- name: clean up the dt_path
  file:
    path: "{{ dt_path }}"
    state: absent

- name: clone architecture repo
  git:
    repo: https://github.com/masco/architecture.git
    dest: "{{ dt_path }}"
    version: bm-ocp
    force: yes

- name: download kustomize lib
  shell:
    curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash 2> /dev/null  || if [ ! -x /usr/bin/kustomize ] ; then exit "install_kustomize.sh download failed" ; fi

- name: move the kustomize to usr-bin
  shell:
    if [ -x kustomize ] ; then mv kustomize /usr/bin/. ; fi

- name: Download or load OCP inventory
  include_tasks: includes/download_ocp_inventory.yml

- name: enable ip forward for ovn-kubernets
  shell: |
    oc patch network.operator cluster -p '{"spec":{"defaultNetwork": {"ovnKubernetesConfig":{"gatewayConfig":{"ipForwarding": "Global"}}}}}' --type=merge

- name: Configure NAT masquerade on public interface
  block:
    - name: get default route
      shell: |
        ip r | grep default | cut -d ' ' -f5
      register: default_route
      become: yes

    - name: masquerade on public interface
      shell: |
        iptables -t nat -A POSTROUTING -o {{ default_route.stdout }} -j MASQUERADE
      become: yes

- name: Setup observability operator
  block:
    - name: Copy observability operator subscription template
      template:
        src: subscriptions.yaml
        dest: "{{ dt_path }}/subscriptions.yaml"

    - name: Apply observability operator subscription
      shell: |
        oc apply -f {{ dt_path }}/subscriptions.yaml

    - name: Wait for observability operator deployment to be created
      shell: |
        oc get deployments/observability-operator -n openshift-operators
      register: obs_deploy
      until: obs_deploy.rc == 0
      retries: 30
      delay: 10

    - name: Wait for observability operator to be available
      shell: |
        oc wait deployments/observability-operator --for condition=Available --timeout=300s -n openshift-operators
  when: telemetry | default(true)
